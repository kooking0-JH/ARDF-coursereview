        window.removeTx = removeTx;

        // 4. 선수 GPX 추가 및 시뮬레이션
        let runners = [];
        let runnerIdSequence = 0;
        let globalStartTime = 0;
        let globalEndTime = 0;
        let currentSimTime = 0;
        let isPlaying = false;
        let animId = null;

        const gpxInput = document.getElementById('gpx-upload');
        const runnerListBox = document.getElementById('runner-list-box');
        const topScoreboardBar = document.getElementById('top-scoreboard-bar');
        const playerBar = document.getElementById('player-bar');
        const btnPlay = document.getElementById('btn-play');
        const timeline = document.getElementById('timeline');
        const speedSelect = document.getElementById('speed-select');

        gpxInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            const bounds = new mapboxgl.LngLatBounds();
            const isFirst = runners.length === 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const text = await file.text();
                const runnerName = file.name.replace(/\.[^/.]+$/, '');
                const runner = parseGPX(text, runnerName, runnerIdSequence++);
                if (runner && runner.points.length > 0) {
                    runners.push(runner);
                    runner.points.forEach(p => bounds.extend([p.lon, p.lat]));
                }
            }

            gpxInput.value = '';
            if (runners.length === 0) return;

            recalcTimeline();
            renderRunnerList();
            renderScoreCards();

            playerBar.style.display = 'flex';

            if (isFirst) {
                currentSimTime = globalStartTime;
                map.fitBounds(bounds, { padding: 90, pitch: 65, duration: 1500 });
            }
            updateSimulation(currentSimTime);
        });

        function parseGPX(gpxText, defaultName, id) {
            const xml = new DOMParser().parseFromString(gpxText, 'application/xml');
            const trkpts = xml.querySelectorAll('trkpt');
            if (trkpts.length === 0) return null;

            const color = PALETTE[id % PALETTE.length];
            const points = [];
            let totalDist = 0, totalEle = 0;
            let prevLat = null, prevLon = null, prevEle = null;

            trkpts.forEach((pt, idx) => {
                const lat = parseFloat(pt.getAttribute('lat'));
                const lon = parseFloat(pt.getAttribute('lon'));
                const eleNode = pt.querySelector('ele');
                const ele = eleNode ? parseFloat(eleNode.textContent) : 0;
                const timeNode = pt.querySelector('time');
                const time = timeNode ? new Date(timeNode.textContent).getTime() : (Date.now() + idx * 1000);

                if (prevLat !== null && prevLon !== null) {
                    totalDist += calculateDistance(prevLat, prevLon, lat, lon);
                    if (prevEle !== null && ele > prevEle) totalEle += (ele - prevEle);
                }

                points.push({ lat, lon, ele, time });
                prevLat = lat; prevLon = lon; prevEle = ele;
            });

            return createRunnerObject(id, defaultName, color, points, totalDist, totalEle);
        }

        function createRunnerObject(id, name, color, points, totalDist, totalEle) {
            const el = document.createElement('div');
            el.className = 'runner-marker-container';
            el.innerHTML = `
                <div class="runner-pulse" style="border-color: ${color}; background: ${color}22;"></div>
                <div class="runner-badge">${name}</div>
                <div class="runner-arrow-wrap">
                    <div class="runner-arrow-inner">
                        <svg viewBox="0 0 24 24" style="width: 22px; height: 22px; display: block;">
                            <polygon points="12,1 23,23 12,17 1,23" fill="${color}" stroke="none"/>
                        </svg>
                    </div>
                </div>
            `;

            const marker = new mapboxgl.Marker({ element: el })
                .setLngLat([points[0].lon, points[0].lat])
                .addTo(map);

            return {
                id: id,
                name: name,
                color: color,
                points: points,
                distance: totalDist,
                elevationGain: totalEle,
                startTime: points[0].time,
                endTime: points[points.length - 1].time,
                marker: marker,
                element: el,
                arrowInner: el.querySelector('.runner-arrow-inner'),
                currentPos: null
            };
        }

        window.deleteRunner = function(id) {
            const idx = runners.findIndex(r => r.id === id);
            if (idx === -1) return;

            runners[idx].marker.remove();
            runners.splice(idx, 1);

            if (runners.length === 0) {
                playerBar.style.display = 'none';
                pauseTrack();
            } else {
                recalcTimeline();
                updateSimulation(currentSimTime);
            }

            renderRunnerList();
            renderScoreCards();
        };

        function recalcTimeline() {
            if (runners.length === 0) return;
            globalStartTime = Math.min(...runners.map(r => r.startTime));
            globalEndTime = Math.max(...runners.map(r => r.endTime));
            if (currentSimTime < globalStartTime || currentSimTime > globalEndTime) {
                currentSimTime = globalStartTime;
            }
        }

        function renderRunnerList() {
            runnerListBox.innerHTML = '';
            runners.forEach((r) => {
                const item = document.createElement('div');
                item.className = 'runner-item';
                item.style.borderLeftColor = r.color;
                item.innerHTML = `
                    <div class="runner-info-wrap">
                        <span class="runner-name-tag" style="color:${r.color};">${r.name}</span>
                        <span class="runner-stats-tag">${r.distance.toFixed(1)}km / ▲${Math.round(r.elevationGain)}m</span>
                    </div>
                    <button class="btn-del-item" onclick="deleteRunner(${r.id})" title="선수 삭제">✕</button>
                `;
                runnerListBox.appendChild(item);
            });
        }

        function renderScoreCards() {
            topScoreboardBar.innerHTML = '';
            runners.forEach((r) => {
                const card = document.createElement('div');
                card.className = 'runner-score-card';
                card.innerHTML = `
                    <div class="card-color-dot" style="background:${r.color}; box-shadow: 0 0 6px ${r.color};"></div>
                    <div class="card-callsign">${r.name}</div>
                    <div class="card-stats">${r.distance.toFixed(1)}k · ▲${Math.round(r.elevationGain)}m</div>
                `;
                card.addEventListener('mouseenter', () => r.element.classList.add('active-hover'));
                card.addEventListener('mouseleave', () => r.element.classList.remove('active-hover'));
                card.addEventListener('click', () => {
                    if (r.currentPos) {
                        map.easeTo({ center: [r.currentPos.lon, r.currentPos.lat], zoom: 15, duration: 900 });
                    }
                });
                topScoreboardBar.appendChild(card);
            });
        }

        function updateSimulation(simTime) {
            runners.forEach(r => {
                if (simTime < r.startTime) {
                    r.element.style.opacity = '0';
                    r.element.style.pointerEvents = 'none';
                    return;
                }
                r.element.style.opacity = '1';
                r.element.style.pointerEvents = 'auto';

                const pos = getInterpolatedPoint(r.points, simTime);
                r.currentPos = pos;
                r.marker.setLngLat([pos.lon, pos.lat]);
                r.arrowInner.style.transform = `rotate(${pos.bearing}deg)`;
            });

            const pct = ((simTime - globalStartTime) / Math.max(1, globalEndTime - globalStartTime)) * 1000;
            timeline.value = Math.min(1000, Math.max(0, pct));
        }

        function getInterpolatedPoint(pts, time) {
            if (time <= pts[0].time) return { lon: pts[0].lon, lat: pts[0].lat, bearing: 0 };
            if (time >= pts[pts.length - 1].time) {
                const last = pts[pts.length - 2] || pts[pts.length - 1];
                const endP = pts[pts.length - 1];
                return { lon: endP.lon, lat: endP.lat, bearing: getBearing(last.lat, last.lon, endP.lat, endP.lon) };
            }

            let low = 0, high = pts.length - 1;
            while (low <= high) {
                const mid = (low + high) >> 1;
                if (pts[mid].time < time) low = mid + 1;
                else high = mid - 1;
            }
            const i1 = Math.max(0, low - 1);
            const i2 = Math.min(pts.length - 1, low);

            const p1 = pts[i1], p2 = pts[i2];
            const span = p2.time - p1.time;
            const ratio = span > 0 ? (time - p1.time) / span : 0;

            return {
                lon: p1.lon + (p2.lon - p1.lon) * ratio,
                lat: p1.lat + (p2.lat - p1.lat) * ratio,
                bearing: getBearing(p1.lat, p1.lon, p2.lat, p2.lon)
            };
        }

        function playLoop(lastTimestamp) {
            function loop(now) {
                if (!isPlaying) return;
                const dt = (now - lastTimestamp) / 1000;
                lastTimestamp = now;

                const speed = parseFloat(speedSelect.value);
                currentSimTime += dt * 1000 * speed;

                if (currentSimTime >= globalEndTime) {
                    currentSimTime = globalEndTime;
                    updateSimulation(currentSimTime);
                    pauseTrack();
                    return;
                }

                updateSimulation(currentSimTime);
                animId = requestAnimationFrame(loop);
            }
            animId = requestAnimationFrame(loop);
        }

        function playTrack() {
            isPlaying = true;
            btnPlay.textContent = '⏸';
            playLoop(performance.now());
        }

        function pauseTrack() {
            isPlaying = false;
            btnPlay.textContent = '▶';
            if (animId) cancelAnimationFrame(animId);
        }

        btnPlay.addEventListener('click', () => {
            if (runners.length === 0) return;
            if (isPlaying) pauseTrack();
            else {
                if (currentSimTime >= globalEndTime) currentSimTime = globalStartTime;
                playTrack();
            }
        });

        timeline.addEventListener('input', (e) => {
            if (runners.length === 0) return;
            const pct = parseFloat(e.target.value) / 1000;
            currentSimTime = globalStartTime + pct * (globalEndTime - globalStartTime);
            updateSimulation(currentSimTime);
        });

        // AI 가상 코스 엔진
        const modeGpx = document.getElementById('mode-gpx');
        const modeGhost = document.getElementById('mode-ghost');

        modeGhost.addEventListener('click', () => {
            const ok = generateVirtualCourse();
            if (!ok) modeGpx.checked = true;
        });

        modeGpx.addEventListener('click', () => {
            removeGhostRunner();
            if (map.getSource('virtual-course-source')) {
                map.getSource('virtual-course-source').setData({ 'type': 'FeatureCollection', 'features': [] });
            }
            cancelGuide();

            if (runners.length > 0) {
                const b = new mapboxgl.LngLatBounds();
                runners.forEach(r => r.points.forEach(p => b.extend([p.lon, p.lat])));
                map.fitBounds(b, { padding: 90, pitch: 65, duration: 1500 });
            }
        });

        function removeGhostRunner() {
            const gIdx = runners.findIndex(r => r.id === 9999);
            if (gIdx !== -1) {
                runners[gIdx].marker.remove();
                runners.splice(gIdx, 1);
                recalcTimeline();
                renderRunnerList();
                renderScoreCards();
                if (runners.length === 0) playerBar.style.display = 'none';
            }
        }

        function findOptimalRoute(startPt, targets, endPt) {
            if (targets.length === 0) return [];
            if (targets.length <= 7) {
                let bestOrder = null;
                let minCost = Infinity;

                function permute(arr, memo = []) {
                    if (arr.length === 0) {
                        let cost = calculateDistance(startPt.lat, startPt.lng, memo[0].lat, memo[0].lng);
                        for (let i = 0; i < memo.length - 1; i++) {
                            cost += calculateDistance(memo[i].lat, memo[i].lng, memo[i+1].lat, memo[i+1].lng);
                        }
                        if (endPt) {
                            cost += calculateDistance(memo[memo.length - 1].lat, memo[memo.length - 1].lng, endPt.lat, endPt.lng);
                        }
                        if (cost < minCost) {
                            minCost = cost;
                            bestOrder = memo;
                        }
                        return;
                    }
                    for (let i = 0; i < arr.length; i++) {
                        const curr = arr.slice();
                        const next = curr.splice(i, 1);
                        permute(curr, memo.concat(next));
                    }
                }

                permute(targets);
                return bestOrder;
            } else {
                let order = sortNearest(startPt, targets);
                let improved = true;
                let iter = 0;
                while (improved && iter < 50) {
                    improved = false;
                    iter++;
                    for (let i = 0; i < order.length - 1; i++) {
                        for (let k = i + 1; k < order.length; k++) {
                            const prevPt = (i === 0) ? startPt : order[i - 1];
                            const nextPt = (k === order.length - 1) ? (endPt || order[k]) : order[k + 1];
                            
                            const curDist = calculateDistance(prevPt.lat, prevPt.lng, order[i].lat, order[i].lng) +
                                            calculateDistance(order[k].lat, order[k].lng, nextPt.lat, nextPt.lng);
                            const newDist = calculateDistance(prevPt.lat, prevPt.lng, order[k].lat, order[k].lng) +
                                            calculateDistance(order[i].lat, order[i].lng, nextPt.lat, nextPt.lng);
                            
                            if (newDist < curDist - 0.001) {
                                const reversed = order.slice(i, k + 1).reverse();
                                order.splice(i, k - i + 1, ...reversed);
                                improved = true;
                            }
                        }
                    }
                }
                return order;
            }
        }

        async function generateVirtualCourse() {
            const hasStart = !!txMarkers['S'];
            const hasFinish = !!txMarkers['F'];
            const targetKeys = Object.keys(txMarkers).filter(k => k !== 'S' && k !== 'F' && k !== 'B');

            if (!hasStart || !hasFinish || targetKeys.length === 0) {
                guideText.textContent = '⚠️ 출발(S), 송신기, 피니시(F)를 먼저 지정해 주세요!';
                btnBannerRedo.style.display = 'none';
                btnBannerBack.style.display = 'none';
                btnBannerConfirm.style.display = 'none';
                guideBanner.style.display = 'flex';
                setTimeout(() => { if (!activeTxKey) guideBanner.style.display = 'none'; }, 2500);
                return false;
            }

            const raceType = raceTypeSelect.value;
            let orderedWaypoints = [];
            orderedWaypoints.push(txMarkers['S']);
            const endTarget = txMarkers['B'] || txMarkers['F'];

            if (raceType === 'sprint') {
                const loop1 = targetKeys.filter(k => !k.includes('F') && k !== 'Sp');
                const loop2 = targetKeys.filter(k => k.includes('F'));
                const midPt = txMarkers['Sp'] || endTarget;
                orderedWaypoints.push(...findOptimalRoute(txMarkers['S'], loop1.map(k => txMarkers[k]), midPt));
                if (txMarkers['Sp']) orderedWaypoints.push(txMarkers['Sp']);
                const lastPt = orderedWaypoints[orderedWaypoints.length - 1];
                orderedWaypoints.push(...findOptimalRoute(lastPt, loop2.map(k => txMarkers[k]), endTarget));
            } else {
                const targets = targetKeys.map(k => txMarkers[k]);
                orderedWaypoints.push(...findOptimalRoute(txMarkers['S'], targets, endTarget));
            }

            if (txMarkers['B']) orderedWaypoints.push(txMarkers['B']);
            orderedWaypoints.push(txMarkers['F']);

            const bounds = new mapboxgl.LngLatBounds();
            orderedWaypoints.forEach(w => bounds.extend([w.lng, w.lat]));
            map.fitBounds(bounds, { padding: 90, pitch: 65, duration: 1500 });

            guideText.textContent = '⏳ 건지산 실제 오솔길 경로를 탐색하고 있습니다...';
            btnBannerRedo.style.display = 'none';
            btnBannerBack.style.display = 'none';
            btnBannerConfirm.style.display = 'none';
            guideBanner.style.display = 'flex';

            let routeCoords = [];
            try {
                const coordStr = orderedWaypoints.map(w => `${w.lng},${w.lat}`).join(';');
                const url = `https://api.mapbox.com/directions/v5/mapbox/walking/${coordStr}?geometries=geojson&overview=full&access_token=${mapboxgl.accessToken}`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.routes && data.routes.length > 0) {
                    routeCoords = data.routes[0].geometry.coordinates;
                }
            } catch (err) {
                console.warn('Mapbox Directions fallback:', err);
            }

            if (routeCoords.length === 0) {
                for (let i = 0; i < orderedWaypoints.length - 1; i++) {
                    const pA = orderedWaypoints[i], pB = orderedWaypoints[i+1];
                    const steps = 15;
                    for (let s = 0; s <= steps; s++) {
                        const r = s / steps;
                        routeCoords.push([pA.lng + (pB.lng - pA.lng) * r, pA.lat + (pB.lat - pA.lat) * r]);
                    }
                }
            }

            const ghostPoints = [];
            let totalDist = 0, totalEle = 0;
            let simTimeCursor = Date.now();
            const PACE_SEC_PER_KM = 360;

            for (let i = 0; i < routeCoords.length; i++) {
                const cLng = routeCoords[i][0];
                const cLat = routeCoords[i][1];

                let ele = 80;
                if (map.queryTerrainElevation) {
                    const terr = map.queryTerrainElevation([cLng, cLat]);
                    if (terr !== null) ele = terr;
                }

                if (ghostPoints.length > 0) {
                    const lastP = ghostPoints[ghostPoints.length - 1];
                    const d = calculateDistance(lastP.lat, lastP.lon, cLat, cLng);
                    totalDist += d;
                    if (ele > lastP.ele) totalEle += (ele - lastP.ele);
                    simTimeCursor += d * PACE_SEC_PER_KM * 1000;
                }

                ghostPoints.push({ lat: cLat, lon: cLng, ele: ele, time: simTimeCursor });
            }

            if (map.getSource('virtual-course-source')) {
                map.getSource('virtual-course-source').setData({
                    'type': 'FeatureCollection',
                    'features': [{
                        'type': 'Feature',
                        'properties': {},
                        'geometry': { 'type': 'LineString', 'coordinates': routeCoords }
                    }]
                });
            }

            removeGhostRunner();
            const ghostRunner = createRunnerObject(9999, 'AI Ghost', '#00cec9', ghostPoints, totalDist, totalEle);
            runners.push(ghostRunner);

            recalcTimeline();
            renderRunnerList();
            renderScoreCards();
            playerBar.style.display = 'flex';

            const seqStr = orderedWaypoints.map(w => w.key).join(' ➔ ');
            const totalMins = Math.round((ghostPoints[ghostPoints.length - 1].time - ghostPoints[0].time) / 60000);
            guideText.textContent = `🎯 AI 가상 코스: ${seqStr} | 총 ${totalDist.toFixed(1)}km / ▲${Math.round(totalEle)}m (예상: ${totalMins}분)`;
            btnBannerRedo.style.display = 'none';
            btnBannerBack.style.display = 'none';
            btnBannerConfirm.style.display = 'none';
            guideBanner.style.display = 'flex';

            currentSimTime = globalStartTime;
            updateSimulation(currentSimTime);
            return true;
        }

        function sortNearest(startPt, targets) {
            const unvisited = [...targets];
            const result = [];
            let current = startPt;

            while (unvisited.length > 0) {
                let nearestIdx = 0;
                let minDist = Infinity;
                for (let i = 0; i < unvisited.length; i++) {
                    const d = calculateDistance(current.lat, current.lng, unvisited[i].lat, unvisited[i].lng);
                    if (d < minDist) {
                        minDist = d;
                        nearestIdx = i;
                    }
                }
                current = unvisited.splice(nearestIdx, 1)[0];
                result.push(current);
            }
            return result;
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // 정확도 : 높음
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function getBearing(startLat, startLng, destLat, destLng) {
            const y = Math.sin((destLng - startLng) * Math.PI / 180) * Math.cos(destLat * Math.PI / 180);
            const x = Math.cos(startLat * Math.PI / 180) * Math.sin(destLat * Math.PI / 180) -
                      Math.sin(startLat * Math.PI / 180) * Math.cos(destLat * Math.PI / 180) * Math.cos((destLng - startLng) * Math.PI / 180);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }
    </script>
