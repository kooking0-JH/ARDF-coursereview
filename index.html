        function parseGPX(gpxText, defaultName, id) {
            const xml = new DOMParser().parseFromString(gpxText, 'application/xml');
            const trkpts = xml.querySelectorAll('trkpt');
            if (trkpts.length === 0) return null;

            const now = Date.now();
            let points = [];
            trkpts.forEach((pt, idx) => {
                const lat = parseFloat(pt.getAttribute('lat'));
                const lon = parseFloat(pt.getAttribute('lon'));
                if (isNaN(lat) || isNaN(lon)) return;
                const eleNode = pt.querySelector('ele');
                const ele = eleNode ? parseFloat(eleNode.textContent) : 0;
                const timeNode = pt.querySelector('time');
                let time = timeNode ? new Date(timeNode.textContent).getTime() : NaN;
                if (isNaN(time)) time = now + idx * 1000;
                points.push({ lat, lon, ele: isNaN(ele) ? 0 : ele, time });
            });
            points.sort((a, b) => a.time - b.time);
            // 같은 시각이 중복된 기록 제거
            points = points.filter((p, i) => i === 0 || p.time > points[i - 1].time);
            if (points.length < 2) return null;

            return createRunnerObject(id, defaultName, PALETTE[id % PALETTE.length], points);
        }

        function distM(lat1, lon1, lat2, lon2) {
            return calculateDistance(lat1, lon1, lat2, lon2) * 1000;
        }

        // 선수 전체 경로 (선택한 선수만 표시)
        function buildSegments(r) {
            return [{
                type: 'Feature',
                properties: { rid: r.id, color: r.color },
                geometry: { type: 'LineString', coordinates: r.points.map(p => [p.lon, p.lat]) }
            }];
        }

        function createRunnerObject(id, name, color, points) {
            const cum = new Float64Array(points.length);
            for (let i = 1; i < points.length; i++) {
                cum[i] = cum[i - 1] + distM(points[i - 1].lat, points[i - 1].lon, points[i].lat, points[i].lon);
            }

            const r = {
                id, name, color, points, cum,
                segments: null,
                startIdx: 0, startTime: points[0].time,
                finishIdx: -1, finishTime: null,
                visits: [],
                distance: 0, elevationGain: 0,
                shift: 0, lastBearing: 0, currentPos: null
            };
            r.segments = buildSegments(r);
            return r;
        }

        function deleteRunner(id) {
            const idx = runners.findIndex(r => r.id === id);
            if (idx === -1) return;
            runners.splice(idx, 1);
            selectedIds.delete(id);

            if (runners.length === 0) {
                playerBar.style.display = 'none';
                pauseTrack();
            }
            refreshTrackData();
            applyTrackFilter();
            recomputeAll();
        }

        // ---------- 출발·TX 통과·피니시 판정 ----------
        function detectStart(r) {
            const p = r.points, n = p.length;
            const S = txMarkers['S'];
            if (S) {
                // 스타트 반경 안에 처음 들어온 뒤, 처음 벗어나는 순간
                const R = Math.max(30, getTxRadius());
                let entered = -1;
                for (let i = 0; i < n; i++) {
                    if (distM(p[i].lat, p[i].lon, S.lat, S.lng) <= R) { entered = i; break; }
                }
                if (entered >= 0) {
                    for (let j = entered; j < n; j++) {
                        if (distM(p[j].lat, p[j].lon, S.lat, S.lng) > R) return Math.max(0, j - 1);
                    }
                }
            }
            // 스타트 미지정: 30초 동안 40m 이상 움직이기 시작한 시점
            let j = 0;
            for (let i = 0; i < n; i++) {
                if (j < i) j = i;
                while (j < n - 1 && p[j].time < p[i].time + 30000) j++;
                if (p[j].time - p[i].time >= 20000 && distM(p[i].lat, p[i].lon, p[j].lat, p[j].lon) >= 40) return i;
            }
            return 0;
        }

        function detectVisits(r) {
            const p = r.points, n = p.length, R = getTxRadius(), s = r.startIdx;
            const visits = [];
            Object.keys(txMarkers).forEach(key => {
                if (key === 'S' || key === 'F') return;
                const m = txMarkers[key];
                for (let i = s; i < n; i++) {
                    if (distM(p[i].lat, p[i].lon, m.lat, m.lng) <= R) {
                        visits.push({ key, idx: i, time: p[i].time });
                        break;
                    }
                }
            });
            visits.sort((a, b) => a.time - b.time);

            let finishIdx = -1;
            const F = txMarkers['F'];
            if (F) {
                let k = visits.length ? visits[visits.length - 1].idx : s;
                // 피니시가 스타트 근처에 있어도 오판하지 않도록, 일단 피니시에서 멀어진 뒤부터 찾음
                while (k < n && distM(p[k].lat, p[k].lon, F.lat, F.lng) <= R * 2) k++;
                for (let i = k; i < n; i++) {
                    if (distM(p[i].lat, p[i].lon, F.lat, F.lng) <= R) { finishIdx = i; break; }
                }
            }
            r.visits = visits;
            r.finishIdx = finishIdx;
            r.finishTime = finishIdx >= 0 ? p[finishIdx].time : null;
        }

        function computeStats(r) {
            const p = r.points;
            const s = r.startIdx;
            const e = r.finishIdx >= 0 ? r.finishIdx : p.length - 1;
            r.distance = (r.cum[e] - r.cum[s]) / 1000;
            // 2m 미만 고도 흔들림은 무시하고 누적 상승고도 계산
            let gain = 0, ref = p[s].ele;
            for (let i = s + 1; i <= e; i++) {
                const d = p[i].ele - ref;
                if (d > 2) { gain += d; ref = p[i].ele; }
                else if (d < 0) ref = p[i].ele;
            }
            r.elevationGain = gain;
        }

        function computeShifts() {
            const mode = startModeSelect.value;
            const gap = START_GAP_MS;
            const ordered = [...runners].sort((a, b) => a.startTime - b.startTime);
            const base = ordered.length ? ordered[0].startTime : 0;
            ordered.forEach((r, k) => {
                if (mode === 'real') r.shift = 0;
                else if (mode === 'same') r.shift = r.startTime - base;
                else r.shift = r.startTime - (base + k * gap);
            });
        }

        function recalcTimeline() {
            if (runners.length === 0) return;
            raceZeroTime = Math.min(...runners.map(r => r.startTime - r.shift));
            globalStartTime = raceZeroTime - 10000;
            globalEndTime = Math.max(...runners.map(r => {
                const last = r.points[r.points.length - 1].time;
                const end = r.finishTime ? Math.min(last, r.finishTime + 60000) : last;
                return end - r.shift;
            }));
            if (globalEndTime <= globalStartTime) globalEndTime = globalStartTime + 1000;
            if (currentSimTime < globalStartTime || currentSimTime > globalEndTime) currentSimTime = globalStartTime;
        }

        function recomputeAll() {
            runners.forEach(r => {
                r.startIdx = detectStart(r);
                r.startTime = r.points[r.startIdx].time;
                detectVisits(r);
                computeStats(r);
            });
            computeShifts();
            recalcTimeline();
            renderRunnerList();
            renderScoreCards();
            if (runners.length) updateSimulation(currentSimTime);
            else if (map.getSource('runners-source')) map.getSource('runners-source').setData(EMPTY_FC);
        }

        // ---------- 선택·표시 설정 ----------
        function trackFilter() {
            return ['in', ['get', 'rid'], ['literal', [...selectedIds]]];
        }
        function refreshTrackData() {
            const src = map.getSource('tracks-source');
            if (src) src.setData({ type: 'FeatureCollection', features: runners.flatMap(r => r.segments) });
        }
        function applyTrackFilter() {
            if (map.getLayer('tracks-layer')) map.setFilter('tracks-layer', trackFilter());
            if (map.getLayer('tracks-casing')) map.setFilter('tracks-casing', trackFilter());
        }

        function toggleSelect(id, forceOn) {
            if (forceOn === true) selectedIds.add(id);
            else if (selectedIds.has(id)) selectedIds.delete(id);
            else selectedIds.add(id);
            applyTrackFilter();
            renderRunnerList();
            renderScoreCards();
            if (runners.length) updateSimulation(currentSimTime);
        }

        document.getElementById('btn-select-all').addEventListener('click', () => {
            const allOn = runners.length > 0 && runners.every(r => selectedIds.has(r.id));
            selectedIds = allOn ? new Set() : new Set(runners.map(r => r.id));
            toggleSelectRefresh();
        });
        function toggleSelectRefresh() {
            applyTrackFilter();
            renderRunnerList();
            renderScoreCards();
            if (runners.length) updateSimulation(currentSimTime);
        }

        startModeSelect.addEventListener('change', () => {
            currentSimTime = -Infinity;
            recomputeAll();
        });

        // ---------- 목록·카드 ----------
        function fmtDur(ms) {
            const neg = ms < 0;
            let s = Math.round(Math.abs(ms) / 1000);
            const h = Math.floor(s / 3600); s -= h * 3600;
            const m = Math.floor(s / 60); s -= m * 60;
            const body = h > 0
                ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`
                : `${m}:${String(s).padStart(2, '0')}`;
            return (neg ? '-' : '') + body;
        }

        function runnerStatsText(r) {
            let t = `${r.distance.toFixed(1)}km · ▲${Math.round(r.elevationGain)}m`;
            if (r.finishTime) t += ` · ${fmtDur(r.finishTime - r.startTime)}`;
            return t;
        }

        function renderRunnerList() {
            runnerListBox.innerHTML = '';
            runners.forEach((r) => {
                const item = document.createElement('div');
                item.className = 'runner-item' + (selectedIds.has(r.id) ? ' selected' : '');
                item.style.borderLeftColor = r.color;
                item.title = '눌러서 전체 경로 보기/숨기기';

                const info = document.createElement('div');
                info.className = 'runner-info-wrap';
                const nm = document.createElement('span');
                nm.className = 'runner-name-tag';
                nm.style.color = r.color;
                nm.textContent = (selectedIds.has(r.id) ? '● ' : '') + r.name;
                const st = document.createElement('span');
                st.className = 'runner-stats-tag';
                st.textContent = runnerStatsText(r);
                info.append(nm, st);

                const del = document.createElement('button');
                del.className = 'btn-del-item';
                del.title = '선수 삭제';
                del.textContent = '✕';
                del.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (r.id === GHOST_ID) { modeGpx.checked = true; exitGhostMode(); }
                    else deleteRunner(r.id);
                });

                item.addEventListener('click', () => toggleSelect(r.id));
                item.append(info, del);
                runnerListBox.appendChild(item);
            });
        }

        function renderScoreCards() {
            topScoreboardBar.innerHTML = '';
            runners.forEach((r) => {
                const card = document.createElement('div');
                card.className = 'runner-score-card' + (selectedIds.has(r.id) ? ' selected' : '');
                const dot = document.createElement('div');
                dot.className = 'card-color-dot';
                dot.style.background = r.color;
                dot.style.boxShadow = `0 0 6px ${r.color}`;
                const cs = document.createElement('div');
                cs.className = 'card-callsign';
                cs.textContent = r.name;
                const stats = document.createElement('div');
                stats.className = 'card-stats';
                stats.textContent = runnerStatsText(r);
                card.append(dot, cs, stats);

                card.addEventListener('mouseenter', () => { hoverRunnerId = r.id; updateSimulation(currentSimTime); });
                card.addEventListener('mouseleave', () => { hoverRunnerId = null; updateSimulation(currentSimTime); });
                card.addEventListener('click', () => {
                    if (!selectedIds.has(r.id)) toggleSelect(r.id, true);
                    if (r.currentPos) map.easeTo({ center: [r.currentPos.lon, r.currentPos.lat], zoom: 15.5, duration: 900 });
                });
                topScoreboardBar.appendChild(card);
            });
        }

        // ---------- 재생 ----------
        function idxAtOrBefore(p, t) {
            if (t < p[0].time) return -1;
            let lo = 0, hi = p.length - 1;
            while (lo < hi) {
                const mid = (lo + hi + 1) >> 1;
                if (p[mid].time <= t) lo = mid; else hi = mid - 1;
            }
            return lo;
        }

        function interp(p, t) {
            const n = p.length;
            if (t <= p[0].time) return { lat: p[0].lat, lon: p[0].lon };
            if (t >= p[n - 1].time) return { lat: p[n - 1].lat, lon: p[n - 1].lon };
            const i = idxAtOrBefore(p, t);
            const a = p[i], b = p[i + 1];
            const span = b.time - a.time;
            const k = span > 0 ? (t - a.time) / span : 0;
            return { lat: a.lat + (b.lat - a.lat) * k, lon: a.lon + (b.lon - a.lon) * k };
        }

        function tailCoords(p, t0, t1, cur) {
            const start = interp(p, t0);
            const out = [[start.lon, start.lat]];
            let i = idxAtOrBefore(p, t0) + 1;
            while (i < p.length && p[i].time < t1) {
                out.push([p[i].lon, p[i].lat]);
                i++;
            }
            out.push([cur.lon, cur.lat]);
            return out;
        }

        function updateSimulation(simTime) {
            const tails = [];
            const heads = [];

            runners.forEach(r => {
                const p = r.points;
                const rawT = simTime + r.shift;
                if (rawT < p[0].time) {
                    r.currentPos = null;
                    return;
                }
                const finished = r.finishTime ? rawT >= r.finishTime : rawT >= p[p.length - 1].time;

                const pos = interp(p, rawT);
                // 5초 전 위치와 비교해 진행 방향 계산 (멈춰 있으면 이전 방향 유지)
                const back = interp(p, rawT - 5000);
                if (distM(back.lat, back.lon, pos.lat, pos.lon) > 2) {
                    r.lastBearing = getBearing(back.lat, back.lon, pos.lat, pos.lon);
                }
                r.currentPos = pos;

                const coords = tailCoords(p, rawT - TAIL_MS, rawT, pos);
                if (coords.length >= 2) {
                    tails.push({
                        type: 'Feature',
                        properties: { color: r.color },
                        geometry: { type: 'LineString', coordinates: coords }
                    });
                }
                heads.push({
                    type: 'Feature',
                    properties: {
                        rid: r.id, name: r.name, color: r.color,
                        bearing: r.lastBearing, finished,
                        big: selectedIds.has(r.id) || hoverRunnerId === r.id
                    },
                    geometry: { type: 'Point', coordinates: [pos.lon, pos.lat] }
                });
            });

            // 꼬리와 화살표를 같은 데이터로 한 번에 넘김 → 같은 화면에서 함께 그려짐
            const src = map.getSource('runners-source');
            if (src) src.setData({ type: 'FeatureCollection', features: tails.concat(heads) });

            const pct = ((simTime - globalStartTime) / Math.max(1, globalEndTime - globalStartTime)) * 1000;
            timeline.value = Math.min(1000, Math.max(0, pct));
            raceClock.textContent = startModeSelect.value === 'real'
                ? new Date(simTime).toLocaleTimeString('ko-KR', { hour12: false })
                : fmtDur(simTime - raceZeroTime);
        }

        function playTrack() {
            isPlaying = true;
            btnPlay.textContent = '⏸';
            let last = performance.now();
            const loop = (now) => {
                if (!isPlaying) return;
                const dt = now - last;
                last = now;
                currentSimTime += dt * parseFloat(speedSelect.value);
                if (currentSimTime >= globalEndTime) {
                    currentSimTime = globalEndTime;
                    updateSimulation(currentSimTime);
                    pauseTrack();
                    return;
                }
                updateSimulation(currentSimTime);
                animId = requestAnimationFrame(loop);
            };
            animId = requestAnimationFrame(loop);
        }

        function pauseTrack() {
            isPlaying = false;
            btnPlay.textContent = '▶';
            if (animId) cancelAnimationFrame(animId);
        }

        function togglePlay() {
            if (runners.length === 0) return;
            if (isPlaying) pauseTrack();
            else {
                if (currentSimTime >= globalEndTime) currentSimTime = globalStartTime;
                playTrack();
            }
        }
        btnPlay.addEventListener('click', togglePlay);

        timeline.addEventListener('input', (e) => {
            if (runners.length === 0) return;
            const pct = parseFloat(e.target.value) / 1000;
            currentSimTime = globalStartTime + pct * (globalEndTime - globalStartTime);
            updateSimulation(currentSimTime);
        });

        // ==========================================
        // 가상 코스 (최단 순서 추천 + 도보 경로)
        // ==========================================
        modeGhost.addEventListener('click', async () => {
            const ok = await generateVirtualCourse();
            if (!ok) modeGpx.checked = true;
        });

        modeGpx.addEventListener('click', exitGhostMode);

        function exitGhostMode() {
            removeGhostRunner();
            if (map.getSource('virtual-course-source')) map.getSource('virtual-course-source').setData(EMPTY_FC);
            cancelGuide();
            const real = runners.filter(r => r.id !== GHOST_ID);
            if (real.length > 0) {
                const b = new mapboxgl.LngLatBounds();
                real.forEach(r => r.points.forEach(p => b.extend([p.lon, p.lat])));
                map.fitBounds(b, { padding: 80, pitch: viewPitch(), duration: 1500 });
            }
        }

        function removeGhostRunner() {
            const gIdx = runners.findIndex(r => r.id === GHOST_ID);
            if (gIdx === -1) return;
            runners.splice(gIdx, 1);
            selectedIds.delete(GHOST_ID);
            refreshTrackData();
            applyTrackFilter();
            recomputeAll();
            if (runners.length === 0) playerBar.style.display = 'none';
        }

        function findOptimalRoute(startPt, targets, endPt) {
            if (targets.length === 0) return [];
            if (targets.length <= 7) {
                let bestOrder = null;
                let minCost = Infinity;
                function permute(arr, memo) {
                    if (arr.length === 0) {
                        let cost = calculateDistance(startPt.lat, startPt.lng, memo[0].lat, memo[0].lng);
                        for (let i = 0; i < memo.length - 1; i++) {
                            cost += calculateDistance(memo[i].lat, memo[i].lng, memo[i + 1].lat, memo[i + 1].lng);
                        }
                        if (endPt) cost += calculateDistance(memo[memo.length - 1].lat, memo[memo.length - 1].lng, endPt.lat, endPt.lng);
                        if (cost < minCost) { minCost = cost; bestOrder = memo; }
                        return;
                    }
                    for (let i = 0; i < arr.length; i++) {
                        const curr = arr.slice();
                        const next = curr.splice(i, 1);
                        permute(curr, memo.concat(next));
                    }
                }
                permute(targets, []);
                return bestOrder;
            }
            // 8개 이상: 가까운 순서로 시작해 2-opt로 개선
            const order = sortNearest(startPt, targets);
            let improved = true, iter = 0;
            while (improved && iter < 50) {
                improved = false;
                iter++;
                for (let i = 0; i < order.length - 1; i++) {
                    for (let k = i + 1; k < order.length; k++) {
                        const prevPt = (i === 0) ? startPt : order[i - 1];
                        const nextPt = (k === order.length - 1) ? (endPt || order[k]) : order[k + 1];
                        const curDist = calculateDistance(prevPt.lat, prevPt.lng, order[i].lat, order[i].lng) +
                                        calculateDistance(order[k].lat, order[k].lng, nextPt.lat, nextPt.lng);
                        const newDist = calculateDistance(prevPt.lat, prevPt.lng, order[k].lat, order[k].lng) +
                                        calculateDistance(order[i].lat, order[i].lng, nextPt.lat, nextPt.lng);
                        if (newDist < curDist - 0.001) {
                            const reversed = order.slice(i, k + 1).reverse();
                            order.splice(i, k - i + 1, ...reversed);
                            improved = true;
                        }
                    }
                }
            }
            return order;
        }

        async function generateVirtualCourse() {
            const hasStart = !!txMarkers['S'];
            const hasFinish = !!txMarkers['F'];
            const targetKeys = Object.keys(txMarkers).filter(k => k !== 'S' && k !== 'F' && k !== 'B');

            if (!hasStart || !hasFinish || targetKeys.length === 0) {
                flashBanner('⚠️ 출발(S), 송신기, 피니시(F)를 먼저 지정해 주세요!', 2500);
                return false;
            }

            const raceType = raceTypeSelect.value;
            const orderedWaypoints = [txMarkers['S']];
            const endTarget = txMarkers['B'] || txMarkers['F'];

            if (raceType === 'sprint') {
                const loop1 = targetKeys.filter(k => !k.includes('F') && k !== 'Sp');
                const loop2 = targetKeys.filter(k => k.includes('F'));
                const midPt = txMarkers['Sp'] || endTarget;
                orderedWaypoints.push(...findOptimalRoute(txMarkers['S'], loop1.map(k => txMarkers[k]), midPt));
                if (txMarkers['Sp']) orderedWaypoints.push(txMarkers['Sp']);
                const lastPt = orderedWaypoints[orderedWaypoints.length - 1];
                orderedWaypoints.push(...findOptimalRoute(lastPt, loop2.map(k => txMarkers[k]), endTarget));
            } else {
                orderedWaypoints.push(...findOptimalRoute(txMarkers['S'], targetKeys.map(k => txMarkers[k]), endTarget));
            }
            if (txMarkers['B']) orderedWaypoints.push(txMarkers['B']);
            orderedWaypoints.push(txMarkers['F']);

            const bounds = new mapboxgl.LngLatBounds();
            orderedWaypoints.forEach(w => bounds.extend([w.lng, w.lat]));
            map.fitBounds(bounds, { padding: 80, pitch: viewPitch(), duration: 1500 });

            flashBanner('⏳ 실제 산길·오솔길 경로를 탐색하고 있습니다...');

            let routeCoords = [];
            try {
                const coordStr = orderedWaypoints.map(w => `${w.lng},${w.lat}`).join(';');
                const url = `https://api.mapbox.com/directions/v5/mapbox/walking/${coordStr}?geometries=geojson&overview=full&access_token=${mapboxgl.accessToken}`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.routes && data.routes.length > 0) routeCoords = data.routes[0].geometry.coordinates;
            } catch (err) {
                console.warn('Mapbox Directions 실패, 직선으로 대체:', err);
            }

            if (routeCoords.length === 0) {
                for (let i = 0; i < orderedWaypoints.length - 1; i++) {
                    const pA = orderedWaypoints[i], pB = orderedWaypoints[i + 1];
                    for (let s = 0; s <= 15; s++) {
                        const r = s / 15;
                        routeCoords.push([pA.lng + (pB.lng - pA.lng) * r, pA.lat + (pB.lat - pA.lat) * r]);
                    }
                }
            }

            const real = runners.filter(r => r.id !== GHOST_ID);
            let simTimeCursor = real.length ? Math.min(...real.map(r => r.startTime)) : Date.now();
            const PACE_SEC_PER_KM = 360;
            const ghostPoints = [];
            let lastEle = 0;

            for (let i = 0; i < routeCoords.length; i++) {
                const [cLng, cLat] = routeCoords[i];
                // 과장 배율이 빠진 실제 고도 (지형이 꺼져 있거나 타일이 없으면 직전 값 사용)
                let ele = lastEle;
                if (map.queryTerrainElevation) {
                    const terr = map.queryTerrainElevation([cLng, cLat], { exaggerated: false });
                    if (terr !== null && terr !== undefined) ele = terr;
                }
                lastEle = ele;

                if (ghostPoints.length > 0) {
                    const lastP = ghostPoints[ghostPoints.length - 1];
                    const d = calculateDistance(lastP.lat, lastP.lon, cLat, cLng);
                    if (d < 0.0005) continue;  // 0.5m 미만 중복점 제외
                    simTimeCursor += d * PACE_SEC_PER_KM * 1000;
                }
                ghostPoints.push({ lat: cLat, lon: cLng, ele, time: Math.round(simTimeCursor) });
            }
            if (ghostPoints.length < 2) {
                flashBanner('⚠️ 경로를 만들 수 없습니다', 2500);
                return false;
            }

            if (map.getSource('virtual-course-source')) {
                map.getSource('virtual-course-source').setData({
                    type: 'FeatureCollection',
                    features: [{ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: routeCoords } }]
                });
            }

            const gIdx = runners.findIndex(r => r.id === GHOST_ID);
            if (gIdx !== -1) runners.splice(gIdx, 1);
            runners.push(createRunnerObject(GHOST_ID, 'AI Ghost', '#00cec9', ghostPoints));
            refreshTrackData();
            recomputeAll();
            playerBar.style.display = 'flex';

            const ghost = runners.find(r => r.id === GHOST_ID);
            const seqStr = orderedWaypoints.map(w => txShort(w.key)).join(' ➔ ');
            const totalMins = Math.round((ghostPoints[ghostPoints.length - 1].time - ghostPoints[0].time) / 60000);
            flashBanner(`🎯 가상 코스: ${seqStr} | ${ghost.distance.toFixed(1)}km / ▲${Math.round(ghost.elevationGain)}m (예상 ${totalMins}분)`, 8000);

            currentSimTime = globalStartTime;
            updateSimulation(currentSimTime);
            return true;
        }

        function sortNearest(startPt, targets) {
            const unvisited = [...targets];
            const result = [];
            let current = startPt;
            while (unvisited.length > 0) {
                let nearestIdx = 0, minDist = Infinity;
                for (let i = 0; i < unvisited.length; i++) {
                    const d = calculateDistance(current.lat, current.lng, unvisited[i].lat, unvisited[i].lng);
                    if (d < minDist) { minDist = d; nearestIdx = i; }
                }
                current = unvisited.splice(nearestIdx, 1)[0];
                result.push(current);
            }
            return result;
        }

        // 두 지점 사이 거리 (km, 하버사인)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function getBearing(startLat, startLng, destLat, destLng) {
            const y = Math.sin((destLng - startLng) * Math.PI / 180) * Math.cos(destLat * Math.PI / 180);
            const x = Math.cos(startLat * Math.PI / 180) * Math.sin(destLat * Math.PI / 180) -
                      Math.sin(startLat * Math.PI / 180) * Math.cos(destLat * Math.PI / 180) * Math.cos((destLng - startLng) * Math.PI / 180);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

    </script>
